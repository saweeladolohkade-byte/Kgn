<style>

:root {

  --brand: #0f5c52;

  --gold-soft: #fbefd2;

  --warn-bg: #fcefc9; --warn-fg: #6b4700; --warn-bd: #e2b94f;

}
:root[data-theme="dark"] {

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.65; }

.wrap {

.track { list-style: none; margin: 0 0 18px; padding: 0; display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }

.slot { display: inline-block; min-width: 4.2ch; min-height: 1.35em; padding: 0 .3ch; margin: 0 .1ch 0 0; text-align: center; font: inherit; color: inherit; background: transparent; border: 0; border-bottom: 3px solid var(--gold); border-radius: 4px 4px 0 0; vertical-align: baseline; }

.slot.bad { background: var(--bad-bg); color: var(--bad-fg); border-color: var(--bad-bd); }

.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 10px; margin-bottom: 14px; }
.opt { min-height: 54px; padding: 10px 8px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--sheet); font: 500 20px/1.2 var(--font-malay); transition: border-color .15s, background .15s; }

.opt.wrong { background: var(--bad-bg); color: var(--bad-fg); border-color: var(--bad-bd); text-decoration: line-through; }
.opt.right { background: var(--ok-bg); color: var(--ok-fg); border-color: var(--ok-bd); }
.opt:disabled:not(.wrong):not(.right) { opacity: .55; }
.opt.placed { opacity: .4; border-style: dashed; }
.opt[draggable="true"] { cursor: grab; }
.how { margin: 0 0 8px; font-size: 13.5px; color: var(--muted); }

.aids { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.aid { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1.5px solid var(--line); border-radius: 999px; background: transparent; font-size: 14px; font-weight: 500; }
.aid:hover { border-color: var(--brand); }
.aid[aria-expanded="true"] { background: var(--gold-soft); border-color: var(--gold); }
.aid svg { width: 18px; height: 18px; flex: none; }
.panel { margin: 0 0 12px; padding: 12px 14px; border-radius: 10px; font-size: 15px; background: var(--gold-soft); }
.panel.tip { background: var(--sheet); }
.panel strong { display: block; font-size: 13px; letter-spacing: .04em; margin-bottom: 2px; }

.fb { margin: 14px 0 0; padding: 14px 16px; border-radius: 12px; border: 1px solid; font-size: 15.5px; }
.fb.ok { background: var(--ok-bg); color: var(--ok-fg); border-color: var(--ok-bd); }
.fb.warn { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn-bd); }
.fb.bad { background: var(--bad-bg); color: var(--bad-fg); border-color: var(--bad-bd); }
.fb small { display: block; margin-top: 8px; font-size: 13px; opacity: .9; }

.primary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 22px; border: 0; border-radius: 12px; background: var(--brand); color: var(--on-brand); font-weight: 600; font-size: 16px; }
.primary:hover { filter: brightness(1.08); }
.ghost { min-height: 48px; padding: 10px 20px; border: 1.5px solid var(--line); border-radius: 12px; background: transparent; font-weight: 500; }
.ghost:hover { border-color: var(--brand); }
.nextrow { margin-top: 16px; display: flex; justify-content: flex-end; }
.primary:disabled { opacity: .45; cursor: default; filter: none; }

.score { text-align: center; padding: 6px 0 18px; }
.score .big { font: 500 clamp(52px, 14vw, 72px)/1 var(--font-display); font-variant-numeric: tabular-nums; }
.score .big span { color: var(--muted); font-size: .5em; }
.score p { margin: 8px auto 0; max-width: 46ch; }
.stats { margin: 0; color: var(--muted); font-size: 14px; }
h2 { margin: 26px 0 10px; font: 500 20px/1.3 var(--font-display); }
.review { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.review li { display: grid; grid-template-columns: 2.2em 1fr auto; gap: 4px 10px; align-items: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.review .n { font: 500 15px/1.6 var(--font-display); color: var(--muted); }
.review .s { font: 600 19px/1.4 var(--font-malay); overflow-wrap: anywhere; }

.badge { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid; white-space: nowrap; }

.badge.retry { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn-bd); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; background: var(--sheet); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.w { font: 600 17px/1.4 var(--font-malay); }
.actions { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px; }

.cover { border: 1px solid var(--line); border-radius: 20px; overflow: hidden; background: var(--surface); }
.cover-top { background: var(--brand); color: var(--on-brand); padding: 28px 22px 26px; }
.cover-top .eyebrow { color: inherit; opacity: .85; }
.cover-top h1 { margin: 8px 0 8px; font-size: clamp(36px, 10vw, 56px); line-height: 1.1; }
.cover-top p { margin: 0; opacity: .94; }
.cloud { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.cloud span { padding: 5px 14px; border: 1.5px solid currentColor; border-radius: 999px; font: 600 18px/1.3 var(--font-malay); opacity: .9; }
.cover-body { padding: 22px; }
.cover-body h2 { margin: 0 0 8px; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 22px; padding: 0; list-style: none; }
.facts li { background: var(--sheet); border-radius: 10px; padding: 10px 6px; text-align: center; font-size: 13.5px; line-height: 1.4; }
.facts b { display: block; font: 500 26px/1.2 var(--font-display); }
.obj { margin: 0 0 22px; padding-left: 1.3em; }
.obj li { margin-bottom: 4px; }
.lesson h2 { margin: 0 0 12px; }
.lesson .eyebrow { margin-bottom: 8px; }
.dots { display: flex; gap: 6px; margin: 0 0 16px; }
.dots i { width: 28px; height: 6px; border-radius: 3px; background: var(--line); }
.dots i.on { background: var(--gold); }
.lesson p { margin: 0 0 12px; }
.ex { background: var(--sheet); border-radius: 12px; padding: 12px 16px; margin: 0 0 12px; }
.ex p { margin: 0; }
.ex .ms { font: 600 22px/1.45 var(--font-malay); }
.ex .tr { color: var(--muted); font-size: 15px; }
.ex mark { background: var(--gold-soft); color: inherit; padding: 0 4px; border-radius: 4px; }
.minis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 0 0 14px; }
.mini { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--sheet); }
.mini .w { font: 600 26px/1.2 var(--font-malay); }
.mini .m { font-size: 14px; color: var(--muted); }
.mini .e { margin-top: 8px; font: 500 17px/1.4 var(--font-malay); }
.mini .t { font-size: 13.5px; color: var(--muted); }
.note { background: var(--gold-soft); border-radius: 10px; padding: 10px 14px; font-size: 15px; }
.checks { margin: 0 0 12px; padding-left: 1.4em; }
.checks li { margin-bottom: 6px; }
.lesson-nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 20px; }
.cover-actions { display: flex; flex-wrap: wrap; gap: 10px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

      (S.solved
        ? '<div class="nextrow"><button type="button" class="primary" id="next" data-act="next">' + (last ? "ดูผลคะแนน" : "ข้อต่อไป") + " →</button></div>"
        : '<div class="nextrow"><button type="button" class="primary" id="check" data-act="check"' + (S.sel ? "" : " disabled") + ">ตรวจคำตอบ</button></div>") +
      "</article>";
  }

  function renderResult(score) {
    var msg;
    if (score === 10) msg = "🎉 Tahniah! Semua jawapan betul! คุณเลือกสรรพนามได้ถูกต้องทั้งหมด 10 ข้อตั้งแต่ครั้งแรก";
    else if (score >= 8) msg = "👏 Bagus! ทำได้ดีมาก ทบทวนข้อที่พลาดอีกนิดก็เต็มแล้ว";
    else if (score >= 5) msg = "😊 Teruskan usaha! พยายามต่อไป ลองอ่านเคล็ดลับของข้อที่พลาดอีกครั้ง";
    else msg = "💪 Jangan putus asa! ฝึกอีกรอบได้เลย ใช้คำใบ้ช่วยได้";
    var hints = S.hintUsed.filter(Boolean).length, tips = S.tipUsed.filter(Boolean).length;
    var rows = ITEMS.map(function (it, j) {
      var ok = S.first[j] === true;
      return '<li><span class="n">' + (j + 1) + '</span><span class="s" lang="ms">' + it.ans + it.post + "</span>" +
        '<span class="badge ' + (ok ? "ok" : "retry") + '">' + (ok ? "ถูกครั้งแรก" : "ลองซ้ำ " + S.misses[j] + " ครั้ง") + "</span>" +
        '<p class="e">' + it.why + "</p></li>";
    }).join("");
    var table = SUMMARY.map(function (r) {
      return '<tr><td class="w">' + r[0] + "</td><td>" + r[1] + "</td><td>" + r[2] + "</td><td>" + r[3] + "</td></tr>";
    }).join("");
    stage.innerHTML =
      '<article class="card"><div class="score"><h2 id="qno" tabindex="-1" style="margin:0 0 4px;font-size:16px;color:var(--muted)">ผลคะแนน (ตอบถูกครั้งแรก)</h2>' +
      '<div class="big">' + score + "<span> / 10</span></div><p>" + msg + "</p>" +
      '<p class="stats">ใช้คำใบ้ ' + hints + " ข้อ · ดูเคล็ดลับ " + tips + " ข้อ</p></div>" +
      '<div class="actions" style="justify-content:center"><button type="button" class="primary" data-act="restart">เริ่มใหม่</button><button type="button" class="ghost" data-act="review">ทบทวนเนื้อหา</button></div></article>' +
      "<h2>เฉลยและคำอธิบายทั้ง 10 ข้อ</h2><ul class=\"review\">" + rows + "</ul>" +
      "<h2>สรุปคำสรรพนามบุรุษที่ 1 และ 3</h2>" +
      '<div class="tablewrap"><table><thead><tr><th>คำ</th><th>บุรุษ</th><th>จำนวน</th><th>ใช้เมื่อ</th></tr></thead><tbody>' + table + "</tbody></table></div>";
  }

  function render(focusSel) {
    var hd = document.getElementById("hd");
    if (S.view === "cover") { hd.hidden = true; renderCover(); }
    else if (S.view === "lesson") { hd.hidden = true; renderLesson(); }
    else {
      hd.hidden = false;
      var score = header();
      if (S.done) renderResult(score); else renderQuestion();
    }
    if (focusSel) {
      var el = stage.querySelector(focusSel);
      if (el) el.focus({ preventScroll: false });
    }
  }

  stage.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b || b.disabled) return;
    var act = b.getAttribute("data-act"), it = ITEMS[S.i];
    if (act === "start" || act === "review") { S.view = "lesson"; S.step = 0; render("#qno"); }
    else if (act === "skip" || act === "toquiz") { S.view = "quiz"; render("#qno"); }
    else if (act === "prev") { if (S.step > 0) S.step--; render("#qno"); }
    else if (act === "nextstep") { if (S.step < STEPS.length - 1) S.step++; render("#qno"); }
    else if (act === "pick") {
      var pv = b.getAttribute("data-v");
      if (S.solved || S.tried.indexOf(pv) > -1) return;
      S.sel = (S.sel === pv) ? null : pv; S.last = null; S.fb = null;
      render('.opt[data-v="' + pv + '"]');
    } else if (act === "clear") {
      if (S.solved || !S.sel) return;
      S.sel = null; render();
    } else if (act === "check") {
      var v = S.sel;
      if (!v || S.solved) return;
      if (S.first[S.i] === null) S.first[S.i] = (v === it.ans);
      if (v === it.ans) {
        S.solved = true; S.last = null;
        S.fb = ["ok", "🟢 Betul! " + it.why];
        render("#next");
      } else {
        S.misses[S.i]++; S.tried.push(v); S.last = v; S.sel = null;
        S.fb = wrongFeedback(it, v);
        if (S.misses[S.i] >= 2 && !S.hintOpen) { S.hintOpen = true; S.hintUsed[S.i] = true; }
        render(".opt:not(:disabled)");
      }
    } else if (act === "hint") {
      S.hintOpen = !S.hintOpen; if (S.hintOpen) S.hintUsed[S.i] = true;
      render("#b-hint");
    } else if (act === "tip") {
      S.tipOpen = !S.tipOpen; if (S.tipOpen) S.tipUsed[S.i] = true;
      render("#b-tip");
    } else if (act === "next") {
      if (S.i === ITEMS.length - 1) S.done = true; else S.i++;
      resetQ();
      render("#qno");
    } else if (act === "restart") {
      S = fresh();
      render("#qno");
    }
  });

  stage.addEventListener("dragstart", function (e) {
    var c = e.target.closest && e.target.closest(".opt");
    if (!c || c.disabled) return;
    e.dataTransfer.setData("text/plain", c.getAttribute("data-v"));
    e.dataTransfer.effectAllowed = "move";
  });
  stage.addEventListener("dragover", function (e) {
    if (!S.solved && e.target.closest && e.target.closest(".slot")) e.preventDefault();
  });
  stage.addEventListener("drop", function (e) {
    var s = e.target.closest && e.target.closest(".slot");
    if (!s || S.solved) return;
    e.preventDefault();
    var dv = e.dataTransfer.getData("text/plain");
    if (NAMES.indexOf(dv) < 0 || S.tried.indexOf(dv) > -1) return;
    S.sel = dv; S.last = null; S.fb = null;
    render("#check");
  });

  S = fresh("cover");
  render();
})();
</script>

</body></html>
